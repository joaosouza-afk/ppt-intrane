<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
:root{--primary:#3b82f6;--pd:#3b82f622;--bg:#0d1520;--bg2:#111d2e;--bg3:#172338;--bg4:#1e2d42;--border:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.13);--text:#e2e8f0;--muted:#94a3b8;--r:10px;}
.sidebar{width:228px;min-width:228px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;top:0;left:0;z-index:100;}
.main{margin-left:228px;min-height:100vh;background:var(--bg);}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 26px;gap:14px;position:sticky;top:0;z-index:50;}
.page{padding:28px;}.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;margin:0 8px 2px;}
.nav-item:hover{background:var(--bg3);color:var(--text);}.nav-item.active{background:var(--pd);color:var(--primary);font-weight:600;}.nav-item.locked{opacity:.3;cursor:not-allowed;pointer-events:none;}.nav-label{flex:1;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;}.csm{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:'DM Sans',sans-serif;}
.bp{background:var(--primary);color:#fff;}.bp:hover{filter:brightness(1.15);}.bg2b{background:transparent;color:var(--muted);border:1px solid var(--b2);}.bg2b:hover{background:var(--bg3);color:var(--text);}
.bd{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2);}.bsm{padding:5px 11px;font-size:12px;}.bxs{padding:3px 8px;font-size:11px;}.btn:disabled{opacity:.35;cursor:not-allowed;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.input,.select,.textarea{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--b2);border-radius:8px;color:var(--text);font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;transition:border .15s;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);}.input:disabled,.select:disabled{opacity:.4;cursor:not-allowed;}.select option{background:var(--bg3);}.textarea{resize:vertical;min-height:72px;}
.label{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}.field{display:flex;flex-direction:column;}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:14px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;padding:28px;}.modal-sm{max-width:480px;}.modal-lg{max-width:900px;}
.table{width:100%;border-collapse:collapse;font-size:13.5px;}.table th{text-align:left;padding:10px 14px;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
.table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}.table tr:hover td{background:rgba(255,255,255,.02);}
.kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;}.kcol{min-width:210px;width:210px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;}
.kcol-h{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.kcol-b{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:60px;}.kcard{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .15s;}
.kcard:hover{background:var(--bg4);transform:translateY(-1px);}.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;color:#fff;flex-shrink:0;}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}.pbar{height:4px;background:var(--bg4);border-radius:4px;overflow:hidden;}.pfill{height:100%;border-radius:4px;transition:width .3s;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--bg3);border:1px solid var(--b2);border-radius:10px;padding:12px 18px;font-size:13.5px;z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,.4);animation:si .2s ease;}
@keyframes si{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.sav{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.scrollbar{scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}.scrollbar::-webkit-scrollbar{width:5px;height:5px;}.scrollbar::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}.login-card{background:var(--bg2);border:1px solid var(--b2);border-radius:18px;width:100%;max-width:380px;padding:36px;margin:20px;}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}.ucard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border .15s;}.ucard:hover{border-color:var(--b2);}
.nav-section{font-size:10px;color:var(--muted);padding:10px 20px 4px;text-transform:uppercase;letter-spacing:.08em;}
.cl-logo{width:40px;height:40px;border-radius:8px;object-fit:contain;background:var(--bg3);border:1px solid var(--border);}.cl-logo-ph{width:40px;height:40px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--muted);}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style></head><body><div id="root"></div>

dit:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,trash:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,search:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,calendar:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,image:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,warning:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,check:<svg style={s} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>};return icons[name]||null;}
const hashStr=s=>{let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36);};
function Av({u,size=32}){return <div className="avatar" style={{width:size,height:size,background:u?.cor||"#3b82f6",fontSize:size*.36}}>{u?.avatar||"??"}</div>;}

function Modal({title,onClose,children,size=""}){return <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&onClose()}><div className={"modal scrollbar "+size}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}><div style={{fontSize:16,fontWeight:700}}>{title}</div><button className="btn bg2b bsm" onClick={onClose}>✕</button></div>{children}</div></div>;}
function Logo({cfg,size="md"}){const h=size==="sm"?36:size==="lg"?56:44;if(cfg?.logoImg)return <img src={cfg.logoImg} alt="Logo" style={{height:h,maxWidth:"100%",objectFit:"contain"}}/>;const sc=size==="sm"?.52:size==="lg"?1.25:1;return <svg width={220*sc*.42} height={80*sc*.42} viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg"><circle cx="18" cy="10" r="7" fill={cfg?.corPrimaria||"#3b82f6"}/><path d="M6 32 Q6 20 18 20 Q30 20 30 32 Z" fill={cfg?.corPrimaria||"#3b82f6"}/><circle cx="42" cy="10" r="7" fill={cfg?.corSecundaria||"#4ade80"}/><path d="M30 32 Q30 20 42 20 Q54 20 54 32 Z" fill={cfg?.corSecundaria||"#4ade80"}/><circle cx="18" cy="52" r="7" fill={cfg?.corTerciaria||"#f59e0b"}/><path d="M6 74 Q6 62 18 62 Q30 62 30 74 Z" fill={cfg?.corTerciaria||"#f59e0b"}/><rect x="33" y="48" width="18" height="18" rx="3" fill="#1e2d42"/><polygon points="51,48 51,66 33,66" fill="#1e2d42"/><text x="68" y="58" fontFamily="'DM Sans',sans-serif" fontWeight="800" fontSize="44" fill="#e2e8f0" letterSpacing="-1">{cfg?.logoLetras||"PPT"}</text></svg>;}
function permLevel(user,cfg,mod){if(!user)return"none";const p=cfg.perfis[user.perfilId];if(!p)return"none";return p.perms[mod]||"none";}
function canView(user,cfg,mod){return permLevel(user,cfg,mod)!=="none";}
