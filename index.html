<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PPT Consultoria</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0d1520;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#111d2e;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:40px;text-align:center;max-width:400px}
h1{font-size:24px;margin-bottom:8px;color:#4ade80}
p{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App(){
  return (
    <div className="box">
      <h1>✅ PPT Intranet</h1>
      <p>Sistema sendo atualizado...</p>
      <p style={{marginTop:16,fontSize:12}}>Deploy em andamento</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
